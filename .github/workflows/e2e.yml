name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - "packages/platform-uk/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "packages/platform-uk/**"
      - ".github/workflows/e2e.yml"

defaults:
  run:
    working-directory: packages/platform-uk

jobs:
  platform-unit-gates:
    name: E2E platform unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      SKIP_EMAIL_SEND: "true"
      DISABLE_RATE_LIMIT: "true"
      E2E_TEST_MODE: "true"
      ENABLE_DIABETES_MODULE: "true"
      # Deterministic agent paths — no live LLM required for unit gates
      ENABLE_LLM_SYNTHESIS: "false"
      ENABLE_LLM_GUARDIAN: "false"
      ENABLE_LLM_ORACLE: "false"
      ENABLE_LLM_DR_ASSIST: "false"
      ENABLE_LLM_NEXUS: "false"
      # Soft SLOs only — do not hard-fail cold CI latency
      PERF_SMOKE_STRICT: "false"
      # Unit gates have no DATABASE_URL — skip Neon-backed Master Journey steps
      AKSH_MASTER_SKIP_DURABLE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/platform-uk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E platform unit gates
        run: npm run test:e2e:platform-unit-gates

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: platform-unit-gates
    env:
      CI: true
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      SKIP_EMAIL_SEND: "true"
      DISABLE_RATE_LIMIT: "true"
      E2E_TEST_MODE: "true"
      ENABLE_DIABETES_MODULE: "true"
      ENABLE_LLM_SYNTHESIS: "false"
      ENABLE_LLM_GUARDIAN: "false"
      ENABLE_LLM_ORACLE: "false"
      ENABLE_LLM_DR_ASSIST: "false"
      ENABLE_LLM_NEXUS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/platform-uk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate E2E database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::E2E_DATABASE_URL secret is not set in GitHub repository settings."
            echo "Add a Neon pooled connection string as E2E_DATABASE_URL under Settings → Secrets and variables → Actions."
            echo "See packages/platform-uk/docs/DEPLOYMENT_CONSOLIDATION.md for details."
            exit 1
          fi

      - name: Verify and build
        run: npm run verify && npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/platform-uk/playwright-report/
          retention-days: 7
