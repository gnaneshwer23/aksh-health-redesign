name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - "packages/platform-uk/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "packages/platform-uk/**"
      - ".github/workflows/e2e.yml"

defaults:
  run:
    working-directory: packages/platform-uk

jobs:
  platform-unit-gates:
    name: E2E platform unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      SKIP_EMAIL_SEND: "true"
      DISABLE_RATE_LIMIT: "true"
      E2E_TEST_MODE: "true"
      ENABLE_DIABETES_MODULE: "true"
      # Deterministic agent paths — no live LLM required for unit gates
      ENABLE_LLM_SYNTHESIS: "false"
      ENABLE_LLM_GUARDIAN: "false"
      ENABLE_LLM_ORACLE: "false"
      ENABLE_LLM_DR_ASSIST: "false"
      ENABLE_LLM_NEXUS: "false"
      # Soft SLOs only — do not hard-fail cold CI latency
      PERF_SMOKE_STRICT: "false"
      # Unit gates have no DATABASE_URL — skip Neon-backed Master Journey steps
      AKSH_MASTER_SKIP_DURABLE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/platform-uk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E platform unit gates
        run: npm run test:e2e:platform-unit-gates

  # B-P2-3 — Evaluation engine + diabetes agent-intel Context/Guardian wiring as a
  # required synthetic CI gate (also embedded in platform-unit-gates for fail-fast).
  ci20-evaluation-gate:
    name: CI 2.0 evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      SKIP_EMAIL_SEND: "true"
      DISABLE_RATE_LIMIT: "true"
      E2E_TEST_MODE: "true"
      ENABLE_DIABETES_MODULE: "true"
      ENABLE_LLM_SYNTHESIS: "false"
      ENABLE_LLM_GUARDIAN: "false"
      ENABLE_LLM_ORACLE: "false"
      ENABLE_LLM_DR_ASSIST: "false"
      ENABLE_LLM_NEXUS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/platform-uk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run CI 2.0 evaluation gate
        run: npm run test:ci20:evaluation-gate

  # Milestone A5 hermetic gate (file-store). Always clears DATABASE_URL inside suites
  # unless MILESTONE_A5_USE_NEON=1 — see packages/platform-uk/tests/helpers/milestone-a5-store-mode.ts.
  milestone-a5-gate:
    name: Milestone A5 hermetic gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      SKIP_EMAIL_SEND: "true"
      DISABLE_RATE_LIMIT: "true"
      E2E_TEST_MODE: "true"
      ENABLE_DIABETES_MODULE: "true"
      ENABLE_LLM_SYNTHESIS: "false"
      ENABLE_LLM_GUARDIAN: "false"
      ENABLE_LLM_ORACLE: "false"
      ENABLE_LLM_DR_ASSIST: "false"
      ENABLE_LLM_NEXUS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/platform-uk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Milestone A5 hermetic gate
        run: npm run test:milestone-a5

  # Optional Neon-backed A5 gate — runs only when Neon GitHub integration is configured.
  # Does not clear DATABASE_URL (MILESTONE_A5_USE_NEON=1). Throwaway branch; never prod.
  milestone-a5-neon-gate:
    name: Milestone A5 Neon gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.NEON_PROJECT_ID != '' }}
    env:
      CI: true
      SKIP_EMAIL_SEND: "true"
      DISABLE_RATE_LIMIT: "true"
      E2E_TEST_MODE: "true"
      ENABLE_DIABETES_MODULE: "true"
      ENABLE_LLM_SYNTHESIS: "false"
      ENABLE_LLM_GUARDIAN: "false"
      ENABLE_LLM_ORACLE: "false"
      ENABLE_LLM_DR_ASSIST: "false"
      ENABLE_LLM_NEXUS: "false"
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/platform-uk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create Neon CI branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci/a5-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Use Neon CI branch for this run
        if: ${{ steps.neon.outputs.db_url_pooled != '' }}
        run: |
          echo "::add-mask::${{ steps.neon.outputs.db_url_pooled }}"
          echo "DATABASE_URL=${{ steps.neon.outputs.db_url_pooled }}" >> "$GITHUB_ENV"

      - name: Validate A5 Neon database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No DATABASE_URL for Milestone A5 Neon gate."
            exit 1
          fi

      - name: Apply pending migrations on CI branch
        working-directory: packages/platform-uk
        run: npx tsx scripts/db-migrate.ts --apply

      - name: Run Milestone A5 Neon gate
        env:
          MILESTONE_A5_USE_NEON: "1"
          USE_POSTGRES: "true"
        run: npm run test:milestone-a5:neon

      - name: Delete Neon CI branch
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Full suite + production build + pending CI-branch migrations; Atlantic latency to Neon (eu-west-2).
    # 40m cancelled mid-Playwright after migrations were added — keep headroom for retries.
    timeout-minutes: 60
    needs: [platform-unit-gates, ci20-evaluation-gate, milestone-a5-gate]
    env:
      CI: true
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      SKIP_EMAIL_SEND: "true"
      DISABLE_RATE_LIMIT: "true"
      E2E_TEST_MODE: "true"
      ENABLE_DIABETES_MODULE: "true"
      ENABLE_LLM_SYNTHESIS: "false"
      ENABLE_LLM_GUARDIAN: "false"
      ENABLE_LLM_ORACLE: "false"
      ENABLE_LLM_DR_ASSIST: "false"
      ENABLE_LLM_NEXUS: "false"
      # Do not set USE_POSTGRES at job level: verify/unit gates assert the default
      # adapter is json_file_repository. Playwright webServer selects postgres via
      # playwright.config.ts when DATABASE_URL is present (see Run Playwright E2E).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/platform-uk/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Each run gets a throwaway Neon branch (copy of the default branch), so test sign-ups and
      # review decisions never land in the database that serves akshhealth.com. Uses the Neon
      # GitHub integration (vars.NEON_PROJECT_ID + secrets.NEON_API_KEY). Falls back to the
      # E2E_DATABASE_URL secret when the integration is not configured.
      - name: Create Neon CI branch
        id: neon
        if: ${{ vars.NEON_PROJECT_ID != '' }}
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci/e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Use Neon CI branch for this run
        if: ${{ steps.neon.outputs.db_url_pooled != '' }}
        run: |
          echo "::add-mask::${{ steps.neon.outputs.db_url_pooled }}"
          echo "DATABASE_URL=${{ steps.neon.outputs.db_url_pooled }}" >> "$GITHUB_ENV"

      - name: Validate E2E database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No E2E database. Connect the Neon GitHub integration (NEON_PROJECT_ID + NEON_API_KEY) or set the E2E_DATABASE_URL secret."
            exit 1
          fi

      # Ephemeral Neon CI branch may lag parent schema. Apply pending additive
      # migrations so connected-diabetes tables (044+) exist. Never targets prod main.
      - name: Apply pending migrations on CI branch
        working-directory: packages/platform-uk
        run: npx tsx scripts/db-migrate.ts --apply

      - name: Verify and build
        run: npm run verify && npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        # Neon CI branch is provisioned above; review-case + SHIELD audit writes only go
        # durable when the postgres adapter is selected (DATABASE_URL alone is not enough).
        # Scoped here (not job env) so verify keeps the json_file default adapter contract.
        env:
          USE_POSTGRES: "true"
          AKSH_STORAGE_ADAPTER: postgres_repository
        run: npm run test:e2e

      - name: Delete Neon CI branch
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/platform-uk/playwright-report/
          retention-days: 7
