# India local dev overlay — extends Akeno `infra/docker-compose.yml`.
# Usage (from akeno_health_platform repo root):
#   docker compose -f infra/docker-compose.yml -f /path/to/akshhealth-india-app/infra/docker-compose.india.yml up -d

services:
  postgres:
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: akeno_india

  identity-consent:
    build:
      context: ../../../Workspace/akeno_health_platform/services/identity-consent
    environment:
      POSTGRES_DSN: postgresql://akeno:akeno@postgres:5432/akeno_india
      DPDPA_REGION: ap-south-1
      DPDPA_DEFAULT_RETENTION_DAYS: "90"
    ports:
      - "8103:8003"

  india-nlp-stub:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./services/india-nlp-stub:/app
    command: python -m http.server 8090
    ports:
      - "8090:8090"
